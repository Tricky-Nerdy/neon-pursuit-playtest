name: Build PorchScope APK

on:
  push:
    paths:
      - "PorchScope/**"
      - ".github/workflows/build-porchscope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: PorchScope
        run: gradle --no-daemon assembleDebug

      - name: Upload PorchScope APK
        uses: actions/upload-artifact@v4
        with:
          name: PorchScope-debug-apk
          path: PorchScope/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
