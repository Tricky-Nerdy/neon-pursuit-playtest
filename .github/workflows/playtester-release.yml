name: Playtester builds

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import Godot project
        shell: bash
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --editor --path . --import --quit
      - name: Test run_all
        shell: bash
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --path . --fixed-fps 60 --script "tests/run_all.gd"
      - name: Test input_devices
        shell: bash
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --path . --fixed-fps 60 --script "tests/input_devices.gd"
      - name: Test ai_endurance
        shell: bash
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --path . --fixed-fps 60 --script "tests/ai_endurance.gd"
      - name: Test mission_scenarios
        shell: bash
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --path . --fixed-fps 60 --script "tests/mission_scenarios.gd"
      - name: Test police_scenarios
        shell: bash
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --path . --fixed-fps 60 --script "tests/police_scenarios.gd"
      - name: Test world_integrity
        shell: bash
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --path . --fixed-fps 60 --script "tests/world_integrity.gd"
      - name: Test night_lighting
        shell: bash
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --path . --fixed-fps 60 --script "tests/night_lighting.gd"

  gameplay-renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and virtual display
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Import Godot project for gameplay capture
        shell: bash
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --editor --path . --import --quit
      - name: Capture real Godot gameplay renders
        shell: bash
        run: |
          engine="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout --signal=TERM --kill-after=5s 45s xvfb-run -a -s "-screen 0 1920x1080x24" "$engine" --path . --resolution 1920x1080 --script tests/render_capture.gd
          mkdir -p gameplay-renders
          cp /tmp/aurora_start.png gameplay-renders/aurora-start.png
          cp /tmp/aurora_menu.png gameplay-renders/aurora-menu.png
          cp /tmp/aurora_map.png gameplay-renders/aurora-map.png
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Bay-5.0-Godot-Renders
          path: gameplay-renders/*.png

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        shell: bash
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Export Linux playtester build
        run: |
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release "Linux Desktop" "$RUNNER_TEMP/NeonPursuit.x86_64"
          mkdir -p "$RUNNER_TEMP/linux-build"
          cp "$RUNNER_TEMP/NeonPursuit.x86_64" "$RUNNER_TEMP/linux-build/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/NeonPursuit-Linux-x86_64.tar.gz" linux-build
      - uses: actions/upload-artifact@v4
        with:
          name: NeonPursuit-Linux-x86_64
          path: ${{ runner.temp }}/NeonPursuit-Linux-x86_64.tar.gz

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.tpz"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot" -Force
          $templateDir = "$env:APPDATA/Godot/export_templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Expand-Archive "$env:RUNNER_TEMP/templates.tpz" "$env:RUNNER_TEMP/templates" -Force
          Copy-Item "$env:RUNNER_TEMP/templates/templates/*" $templateDir -Recurse -Force
      - name: Export Windows playtester build
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/godot/Godot_v$env:GODOT_VERSION-stable_win64.exe" --headless --path . --export-release "Windows Desktop" "$env:RUNNER_TEMP/NeonPursuit.exe"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows-build" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/NeonPursuit.exe" "$env:RUNNER_TEMP/windows-build/"
          Compress-Archive -Path "$env:RUNNER_TEMP/windows-build/*" -DestinationPath "$env:RUNNER_TEMP/NeonPursuit-Windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NeonPursuit-Windows-x86_64
          path: ${{ runner.temp }}/NeonPursuit-Windows-x86_64.zip

  android-apk:
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_ANDROID_RELEASE == 'true'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and persistent tester signing key
        env:
          ANDROID_TESTER_KEYSTORE_BASE64: ${{ secrets.ANDROID_TESTER_KEYSTORE_BASE64 }}
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_TESTER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tester.keystore"
      - name: Install Godot and templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Export installable Android tester APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/tester.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_TESTER_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_TESTER_KEY_PASSWORD }}
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release Android "$RUNNER_TEMP/NeonPursuit-Android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: NeonPursuit-Android-arm64
          path: ${{ runner.temp }}/NeonPursuit-Android-arm64.apk

  publish-release:
    needs: [build-linux, build-windows, android-apk]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-linux.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NeonPursuit-*
          path: release-assets
          merge-multiple: true
          if-no-files-found: warn
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
